name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Frontend survival-contract checks
        run: node --test tests/gui_survival.test.cjs
      - name: End-to-end smoke experiment
        run: python -m evolution_lab_v2 experiment --config configs/comparison_smoke.json --output runs/ci_smoke
