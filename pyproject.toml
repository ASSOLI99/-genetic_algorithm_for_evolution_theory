[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-lab-v2"
version = "0.7.0"
description = "Auditable diploid and demographic comparison experiments for Evolution Lab"
requires-python = ">=3.13"
dependencies = ["numpy==2.5.3", "matplotlib==3.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.5"]

[project.scripts]
evolution-lab = "evolution_lab_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evolution_lab_v2 = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "test_evolution_lab.py"]
addopts = "-ra"
